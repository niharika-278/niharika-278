name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Pink Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: niharika-278
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300D9C0&color_dots=%23FFF0F7,%23FFB3DA,%23FF69B4,%23FF1493,%23C90076
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300D9C0&color_dots=%23161B22,%234A1836,%23A51C65,%23FF1493,%23FF69B4
      - name: Push Snake to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
