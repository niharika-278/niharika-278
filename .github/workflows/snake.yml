name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Pink Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: niharika-278
          outputs: |
              dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%238B5CF6&color_dots=%23FCE7F3,%23F9C5DF,%23F08ABF,%23D94F9B,%23A83275
              dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23C084FC&color_dots=%23161B22,%233B1D35,%237A2858,%23C04B87,%23FF9ACB
      - name: Push Snake to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
